; PlatformIO project configuration for the Etch-a-Sketch Drawing Machine firmware.
; See Design §10.3 for the full firmware build documentation.
;
; Layout (Design §10.1):
;   firmware/
;     etchasketch.ino       <- Arduino sketch entry point
;     src/                  <- module sources (motion/, backlash/, nvm/, ...)
;     tests/                <- host-side Catch2 + rapidcheck tests
;     platformio.ini
;
; The sketch is kept at the project root (alongside platformio.ini) so the
; folder is also a valid arduino-cli sketch directory; src_dir is overridden
; to include both the .ino and the module subdirectories.

[platformio]
default_envs = uno_r4_wifi
src_dir = .
include_dir = src
test_dir = tests

[env:uno_r4_wifi]
; Target: Arduino UNO R4 WiFi (Renesas RA4M1 + ESP32-S3 radio co-processor).
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
build_flags =
  -DSPA_HOST=embedded
  -Wall
  -Wextra
build_src_filter =
  +<src/>
  -<tests/>
  -<scripts/>
  ; ble_server.cpp pulls in <ArduinoBLE.h>, which is not available to the WiFi
  ; image; exclude it so the BLE radio stack never compiles/links into a WiFi
  ; build. The BLE env (uno_r4_wifi_ble) re-includes it and excludes ws_server
  ; instead, so exactly one transport server is in each image (Req 1.2, 1.3).
  -<src/protocol/ble_server.cpp>
# WiFiS3 and Arduino_LED_Matrix ship bundled with the renesas-ra UNO R4 core
# (framework-arduinorenesas-uno/libraries) and are auto-discovered from the
# #include graph, so they MUST NOT be listed here -- doing so makes PlatformIO
# try (and fail) to resolve them from the registry. Only genuinely external
# libraries belong in lib_deps.
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
; Pre-build step (task 29.2): gzip the SPA bundle from web/dist.gz/index.html.gz
; into src/web_assets.h as a PROGMEM blob, enforcing the 120 KB budget. The
; script no-ops for any env that does not embed the WiFi web assets (host_test,
; the BLE image) so those builds are unaffected. Run `cd web && npm run build`
; first to produce the bundle.
extra_scripts = pre:scripts/embed_web_assets.py

; ---------------------------------------------------------------------------
; Compile-time transport selection (Design §4; Requirement 1).
;
; On the UNO R4 WiFi the WiFi stack (WiFiS3) and the BLE stack (ArduinoBLE)
; share one ESP32-S3 radio co-processor and cannot run concurrently, so exactly
; ONE transport is linked per image, chosen by the `ETCH_TRANSPORT` build flag
; (resolved by src/transport_config.h). Library dependencies are partitioned so
; each radio stack links only into its own image (Req 1.2, 1.3):
;
;   * uno_r4_wifi_ble  -> -D ETCH_TRANSPORT=ble,  lib_deps: ArduinoBLE ONLY
;                         (WiFiS3/ArduinoJson are NOT pulled in, so the WiFi
;                          radio stack never links into the BLE image).
;   * uno_r4_wifi_wifi -> -D ETCH_TRANSPORT=wifi, lib_deps: ArduinoJson
;                         (WiFiS3 is auto-discovered from the #include graph as
;                          it ships bundled with the renesas-ra core).
;
; Both extend the base `uno_r4_wifi` env for platform/board/framework/flags and
; the web-asset embed hook. The legacy `uno_r4_wifi` env (the default) is kept
; unchanged so existing workflows are unaffected.
; ---------------------------------------------------------------------------

[env:uno_r4_wifi_ble]
extends = env:uno_r4_wifi
build_flags =
  ${env:uno_r4_wifi.build_flags}
  -D ETCH_TRANSPORT=ble
; BLE image source partition: compile ble_server.cpp (excluded by the base
; filter) and drop the WiFi transport sources so the WiFi radio stack is never
; built into the BLE image. ws_server.cpp (WebSocket transport), wifi_manager.cpp
; (WiFiS3 STA/AP manager) and http_server.cpp (SPA/REST server) all pull in the
; WiFi co-processor stack; the sketch excludes their objects under the BLE flag
; (task 4.2), so dropping the sources keeps WiFi entirely out of the BLE link
; (Req 1.6, 9.3). The complete WiFi source remains in the tree (Req 1.4).
build_src_filter =
  ${env:uno_r4_wifi.build_src_filter}
  +<src/protocol/ble_server.cpp>
  -<src/protocol/ws_server.cpp>
  -<src/wifi/wifi_manager.cpp>
  -<src/http/http_server.cpp>
; BLE image: ArduinoBLE ONLY. Deliberately does NOT inherit the base env's
; ArduinoJson dependency, and omits WiFiS3, so the WiFi radio stack is never
; linked into the BLE image (Req 1.2).
lib_deps =
  arduino-libraries/ArduinoBLE @ ^1.3.0

[env:uno_r4_wifi_wifi]
extends = env:uno_r4_wifi
build_flags =
  ${env:uno_r4_wifi.build_flags}
  -D ETCH_TRANSPORT=wifi
; WiFi image: retains ArduinoJson; WiFiS3 + Arduino_LED_Matrix are auto-
; discovered from the #include graph (bundled with the renesas-ra core) and so
; MUST NOT be listed here. ArduinoBLE is intentionally absent (Req 1.3).
lib_deps =
  ${env:uno_r4_wifi.lib_deps}

[env:host_test]
; Host-side unit / property tests using Catch2 v3 + rapidcheck.
; Run with: pio test -e host_test
platform = native
build_flags =
  -std=gnu++17
  -DUNIT_TEST_HOST
  -Wall
  -Wextra
test_framework = custom
test_build_src = no
lib_deps =
  https://github.com/catchorg/Catch2.git#v3.5.3
  https://github.com/emil-e/rapidcheck.git
